name: Task
description: A task from the final project schedule (objective, user story, scope, acceptance criteria)
title: "[P?] "
labels: ["task"]
type: Task
projects: ["AndersonGACFilho/18"]
body:
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - P1 Filipe Moura (solver and evaluation)
        - P2 (environment and MO-PPO)
        - P3 (oracle and literature)
        - P4 Anderson Gonçalves (ω̂ inference and coordination)
        - Everyone
    validations:
      required: true
  - type: input
    id: due
    attributes:
      label: Due
      placeholder: "Wed 11/18"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Solver
        - Environment
        - Agent
        - Experiment
        - Writing
        - Coordination
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One sentence on the outcome this task delivers.
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: User story
      value: "As <role>, I want <capability> so that <benefit>."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this task exists, and links to papers, feedback or related issues.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        **In scope**
        -

        **Out of scope**
        -
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Objective, testable conditions. Prefer "Given … when … then …".
      value: |
        - [ ] **AC1:** Given …, when …, then …
        - [ ] **AC2:**
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
      value: |
        - [ ] Code or outcome merged / recorded (PR reviewed, or result posted in this issue)
        - [ ] Tests or sanity checks pass
        - [ ] README or paper updated where relevant
        - [ ] All acceptance criteria checked
  - type: textarea
    id: notes
    attributes:
      label: Technical notes
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Also add them as "blocked by" relationships in the issue sidebar.
      value: |
        - **Blocked by:** None
        - **Blocks:** None
